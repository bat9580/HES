{% extends "base.html" %}

{% block content %}
{% if message %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(() => {
    showToast('{{ message }}', 'success');
  }, 300);
});
</script>
{% endif %} 
  <div class="container-fluid">
    <div class="row">
      
      <!-- Left side: Role table -->
      <div class="col-md-7">
        <h2 class="page-title mb-4">Эрхүүд</h2>  
        <div class="filter-bar-container">
          <form method="GET" action="/search-role" class="filter-bar"> 
            <div class="col-md-auto" style="width: 20%; min-height: 35px; height: auto;"> 
                <input type="text" 
                        class="form-control dropdown-search-input dimmed-text hoverable-input" 
                        name="role_name"
                        placeholder="Эрх хайх"
                        value="{{ role_name | default('') }}"
                        style="height: 33px; border-radius: 2px !important; padding-right: 30px;">
            </div>
            <!-- <input type="text" class="form-control" style="max-width: 200px;" placeholder="Device Addr" name="dcu_number" value="{{ dcu_number | default('') }}"> -->
            
            <div class="col-md-auto" style="width: 4.166666%;">
            <button type="submit" class="btn btn-light w-100 border dimmed-text" style="height: 33px; border-radius: 2px" > 
                <i class="bi bi-search"></i> 
            </button>
            </div>
            <div class="col-md-auto">
            <button type="button" class="btn btn-light w-100 border dimmed-text" style="height: 33px; border-radius: 2px" data-bs-toggle="modal" data-bs-target="#addRoleModal">
                <i class="bi bi-plus-lg"></i>
            </button>
            </div>
            <div class="col-md-auto" >
            <button type="submit" class="btn btn-light w-100 border dimmed-text" id="clear-selected-button" style="height: 33px; border-radius: 2px" > 
                <i class="bi bi-trash3"> Устгах</i> 
            </button>
            </div>
            
                

        </form> 
        </div>

        
        <table class="table table-bordered table-hover table-striped align-middle text-center">
            <thead class="table-light">
                <tr>
                <th><input type="checkbox" id="select-all"></th>
                <th>#</th>
                <th>Эрхийн нэр</th>
                <th>Тайлбар</th> 
                <th>Үйлдэл</th>  
                </tr>
            </thead>
            <tbody id="device-table-body">
                {% for role in roles %}  
                <tr>
                <td><input type="checkbox" class="device-checkbox" value="{{ role['role_name']}}"></td>  
                <td>{{ loop.index }}</td>
                <td>{{ role['role_name'] }}</td> 
                <td>{{ role['remark'] }}</td>
                <td>
                    <button class="btn btn-secondary btn-sm" 
                            data-bs-toggle="modal" 
                            data-bs-target="#editRoleModal"     
                            data-role-name="{{role['role_name']}}"   
                            data-remarks="{{role['remark']}}">
                        Засах
                    </button> 
                </td> 
                </tr>
                {% endfor %}
                <!-- dynamic rows here -->
            </tbody>
            </table>
      </div>

<div class="modal fade" id="addRoleModal" tabindex="-1" aria-labelledby="addRoleModalLabel" aria-hidden="true">
  <div class="modal-dialog custom-modal modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addRoleModalLabel">Эрх нэмэх</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addRoleForm" method = "Post" action = "/add-role">      
        <!-- Nav tabs -->
        <!-- Tab panes -->
        <div class="tab-content">
          <div class="tab-pane fade show active" id="detail" role="tabpanel">
                
                <div class="col-md-auto">
                  <label>Эрхийн нэр:</label> 
                  <input type="text" name="role_name" class="form-control" required> 
                </div>
                <div class="col-md-auto">
                  <label>Тэмдэглэгээ:</label>
                  <input type="text" name="remarks"  class="form-control">
                </div>
          </div>
        </div>
      </form>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="addRoleForm" class="btn btn-primary">Submit</button>
      </div>
    </div>
  </div>
</div>


      
      <!-- Right side: Role Authorization -->
      <div class="col-md-5">
        <div class="auth-panel">
            <h5>Цэсүүд</h5> 
            <form id="permissionForm" method="POST" action="/update-permissions">
            
            <!-- Hidden field to store the selected role -->
            <input type="hidden" name="role_name" id="selectedRoleInput">


            <div class="form-check d-flex align-items-center">
                <input class="form-check-input me-2" type="checkbox" name="permissions" value="Warehouse" id="perm-archive">
                <label class="form-check-label mb-2" for="perm-archive">Бүртгэл</label>
            </div>

            <div class="form-check d-flex align-items-center">
                <input class="form-check-input me-2" type="checkbox" name="permissions" value="Archive" id="perm-data">
                <label class="form-check-label mb-2" for="perm-data">Суурилуулалт</label>
            </div>

            <div class="form-check d-flex align-items-center">
                <input class="form-check-input me-2" type="checkbox" name="permissions" value="Remote Maintain" id="perm-remote">
                <label class="form-check-label mb-2" for="perm-remote">Шууд унших</label> 
            </div>

            <div class="form-check d-flex align-items-center">
                <input class="form-check-input me-2" type="checkbox" name="permissions" value="System Task" id="perm-task">
                <label class="form-check-label mb-2" for="perm-task">Хуваариуд</label>
            </div>

            <div class="form-check d-flex align-items-center">
                <input class="form-check-input me-2" type="checkbox" name="permissions" value="Data analysis" id="perm-system">
                <label class="form-check-label mb-2" for="perm-system">Өгөгдлүүд</label> 
            </div>
            <div class="form-check d-flex align-items-center">
                <input class="form-check-input me-2" type="checkbox" name="permissions" value="System Management" id="perm-system">
                <label class="form-check-label mb-2" for="perm-system">Систем</label>  
            </div> 

            <hr>
            <button type="submit" class="btn btn-primary">Save Permissions</button>
            </form>
        </div>
        </div>
      
    </div>
  </div>

<style>
  .auth-panel {
    border: 1px solid #dee2e6;   /* light gray border */
    border-radius: 2px;          /* rounded corners */
    padding: 16px;               /* spacing inside */
    background-color: #fff;      /* white background */
    box-shadow: 0 2px 6px rgba(0,0,0,0.05); /* subtle shadow */
  }
  .auth-panel .form-check-label {
    font-size: 14px;        /* Change font size */
    font-weight: 500;       /* Make text bold */
    font-family: Arial, sans-serif; /* Change font family */
}
  .auth-panel .form-check {
    margin-bottom: -0.40rem; /* reduce vertical gap between checkboxes */
} 
  .permission-checkbox {
    margin-right: 5px; /* reduce horizontal space */
    margin-left: 0;
} 
</style>
  <script>
    

    document.addEventListener('DOMContentLoaded', () => {
    const tableBody = document.getElementById('device-table-body');
    const permissionCheckboxes = document.querySelectorAll('.auth-panel .form-check-input');
    const selectedRoleInput = document.getElementById('selectedRoleInput');
    const rolePermissions = {{ role_permissions | tojson | safe }}; 
    console.log(rolePermissions); // { "Admin": [...], "User": [...] }
    tableBody.querySelectorAll('tr').forEach(row => {
    row.addEventListener('click', () => {
        // Highlight row
        tableBody.querySelectorAll('tr').forEach(r => r.classList.remove('table-active'));
        row.classList.add('table-active');

        // Get role name
        const roleName = row.querySelector('td:nth-child(3)').textContent.trim();
        selectedRoleInput.value = roleName; // store role in hidden input

        // Find permissions for this role
        const perms = rolePermissions[roleName] || [];

        // Update checkboxes
        permissionCheckboxes.forEach(checkbox => {
            const permValue = checkbox.value;
            checkbox.checked = perms.includes(permValue);
        });
    });
});
});


document.getElementById('clear-selected-button').addEventListener('click', function () {
  const selectedRoles = Array.from(document.querySelectorAll('.device-checkbox:checked')).map(cb => cb.value);

  if (selectedRoles.length === 0) {
    alert("Please select at least one Role."); 
    return;
  }

  fetch('/clear-roles', {  
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      selected_roles: selectedRoles 
    })
  }); 

}); 
</script> 
{% endblock %}
