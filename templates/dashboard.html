{% extends "base.html" %}

{% block content %}
<div class="container my-4">
  <div class="row g-3 mb-4 align-items-center">
        <div class="col d-flex align-items-center justify-content-between">
            <h2 class="mb-0">Хяналтын самбар</h2>
            <!-- Dropdown / search input next to title -->
            <div style="width: 250px;">
                <div class="dropdown" style="height: 35px;">
                    <div class="dropdown-toggle-wrapper position-relative" id="parentNodeDropdown">
                        <input type="text" class="form-control dropdown-search-input dimmed-text hoverable-input" placeholder="Бүлэг хайх" value="{{ Zone | default('') }}" style="height: 33px; border-radius: 2px !important; padding-right: 30px;">
                        <span class="dropdown-chevron position-absolute end-0 top-50 translate-middle-y me-2">
                            <svg width="25" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

  <!-- Stats Cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-auto">
            <div class="card shadow-sm stat-card">
                <div class="card-body text-center">
                    <h5 class="text-muted">Онлайн үзүүлэлт</h5>
                    <canvas id="onlineChart" width="165" height="180"></canvas>
                    <div class="d-flex justify-content-center mt-3 gap-3">
                        <!-- Online -->
                        <div class="d-flex align-items-center gap-1">
                            <span style="display:inline-block; width:15px; height:15px; background-color:#ffcd32; border-radius:50%;"></span>
                            <small>Online</small>
                        </div>
                        <!-- Offline -->
                        <div class="d-flex align-items-center gap-1">
                            <span style="display:inline-block; width:15px; height:15px; background-color:#e9ecef; border-radius:50%;"></span>
                            <small>Offline</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-auto">
            <div class="card shadow-sm stat-card">
                <div class="card-body text-center">
                    <h5 class="text-muted">Тоолуурын төрөл</h5>
                    <canvas id="meterTypeChart" width="165" height="180"></canvas>
                    <div class="d-flex justify-content-center mt-3 gap-3">
                        <!-- Online -->
                        <div class="d-flex align-items-center gap-1">
                            <span style="display:inline-block; width:15px; height:15px; background-color:#ffcd32; border-radius:50%;"></span>
                            <small>DDSY283</small> 
                        </div>
                        <!-- Offline -->
                        <div class="d-flex align-items-center gap-1">
                            <span style="display:inline-block; width:15px; height:15px; background-color:#39515c; border-radius:50%;"></span>
                            <small>DTSD545S</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-auto">
            <div class="card shadow-sm stat-card">
                <div class="card-body text-center">
                    <h5 class="text-muted">Суурилуулалт</h5>
                    <canvas id="installationsChart" width="165" height="180"></canvas>
                    <div class="d-flex justify-content-center mt-3 gap-3">
                        <!-- Online -->
                        <div class="d-flex align-items-center gap-1">
                            <span style="display:inline-block; width:15px; height:15px; background-color:#ffcd32; border-radius:50%;"></span>
                            <small>installed</small> 
                        </div>
                        <!-- Offline -->
                        <div class="d-flex align-items-center gap-1">
                            <span style="display:inline-block; width:15px; height:15px; background-color:#02396f; border-radius:50%;"></span>
                            <small>archived</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="text-muted">Нийт ачаалал (сүүлийн 6 цаг) (кВт)</h5> 
                    <canvas id="consumptionLineChart" height="120"></canvas>
                </div>
            </div>
        </div>


  </div>
  <!-- Charts -->
  
<div class="row g-4"> 
<div class="col-md-6">
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="text-muted">Сүүлийн 24 цагийн хэрэглээ</h5>
                  
        
      <canvas id="consumptionBarChart24hour" height="100"></canvas>
    </div>
  </div>
</div>

<div class="col-md-6">
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="text-muted">Сүүлийн 30 хоногийн хэрэглээ</h5>
      <canvas id="consumptionBarChart30day" height="100"></canvas>
    </div>
  </div>
</div> 
</div> 

</div>
<script>
const centerTextPlugin = {
    id: 'centerText',
    beforeDraw(chart) {
        const { ctx, width, height } = chart;
        ctx.save();
        const fontSize = (height / 5).toFixed(2);
        ctx.font = fontSize + "px sans-serif";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#000";
        const text = "{{ total_installations }}"; // Replace with your dynamic value if needed
        const textX = Math.round((width - ctx.measureText(text).width) / 2);
        const textY = height / 2;
        ctx.fillText(text, textX, textY);
        ctx.restore();
    }
};
const centerTextPlugin1 = {
    id: 'centerText',
    beforeDraw(chart) {
        const { ctx, width, height } = chart;
        ctx.save();
        const fontSize = (height / 5).toFixed(2);
        ctx.font = fontSize + "px sans-serif";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#000";
        const text = "{{ total_installations }}"; // Replace with your dynamic value if needed
        const textX = Math.round((width - ctx.measureText(text).width) / 2);
        const textY = height / 2;
        ctx.fillText(text, textX, textY);
        ctx.restore();
    }
};
const centerTextPlugin2 = {
    id: 'centerText',
    beforeDraw(chart) {
        const { ctx, width, height } = chart;
        ctx.save();
        const fontSize = (height / 5).toFixed(2);
        ctx.font = fontSize + "px sans-serif";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#000";
        const text = "{{ registered_meter_count }}"; // Replace with your dynamic value if needed
        const textX = Math.round((width - ctx.measureText(text).width) / 2);
        const textY = height / 2;
        ctx.fillText(text, textX, textY);
        ctx.restore();
    }
};  

const onlineChart = new Chart(document.getElementById('onlineChart'), {
    type: 'doughnut',
    data: {
        labels: ['Online', 'Offline'],
        datasets: [{
            data: [{{ total_online_meter }}, {{ total_installations - total_online_meter }}], 
            backgroundColor: ['#ffcd32', '#e9ecef'],
            borderWidth: 0
        }]
    },
    options: {
        cutout: '80%',
        plugins: {
            legend: { display: false }
        },
        responsive: false
    },
    plugins: [centerTextPlugin]
});

const meterTypeChart = new Chart(document.getElementById('meterTypeChart'), {
    type: 'doughnut',
    data: {
        labels: ['DDSY283SR', 'DTSD545S', 'DTSD546'] ,
        datasets: [{
            data: [{{ type_counts["DDSY283SR"] }}, {{ type_counts["DTSD546"] }}, {{ type_counts["DTSD545S"] }}], 
            backgroundColor: ['#ffcd32', '#37505b','#39515c'],  
            borderWidth: 0
        }]
    },
    options: {
        cutout: '80%',
        plugins: {
            legend: {
                display: false
            }
        },
        responsive: false
    },
    plugins: [centerTextPlugin] // register your custom plugin here
});

const installationsChart = new Chart(document.getElementById('installationsChart'), {
    type: 'doughnut',
    data: {
        labels: ['installed', 'archived'],
        datasets: [{ 
            data: [{{ total_installations }}, {{ registered_meter_count - total_installations }}], 
            backgroundColor: ['#ffcd32', '#02396f'],
            borderWidth: 0
        }]
    },
    options: {
        cutout: '80%',
        plugins: {
            legend: {
                display: false
            }
        },
        responsive: false
    },
    plugins: [centerTextPlugin2] // register your custom plugin here
});
 


const consumptionLineChart = new Chart(document.getElementById("consumptionLineChart"), {
    type: 'line',
    data: {
      labels: [],  
      datasets: [{
        label: 'Active Power (kWh)',
        data: [],
        fill: true,
        borderColor: '#007bff',
        backgroundColor: 'rgba(0,123,255,0.2)',
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          display: false
        }
      },
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

const consumptionBarChart24hour = new Chart(document.getElementById("consumptionBarChart24hour"), {
    type: 'bar',
    data: {
      labels: [],  // e.g. ['Jan', 'Feb', 'Mar', 'Apr']
      datasets: [{
        label: 'Хэрэглээ (Kв.цаг)' ,
        data: [],  // e.g. [85, 90, 80, 95]
        backgroundColor: '#28a745',
        borderRadius: 5,
        barThickness: 12  // adjust bar width here
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          display: false
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: 'Хэрэглээ (Kв.цаг)'  
          }
        },
        x: {
          title: {
            display: true,
            text: 'Сүүлын 24 цаг' 
          }
        }
      }
    }
  });

const consumptionBarChart30day = new Chart(document.getElementById("consumptionBarChart30day"), {
    type: 'bar',
    data: {
      labels: [],  // e.g. ['Jan', 'Feb', 'Mar', 'Apr']
      datasets: [{
        label: 'Хэрэглээ (Kв.цаг)' ,
        data: [],  // e.g. [85, 90, 80, 95]
        backgroundColor: '#2b3eba',
        borderRadius: 5,
        barThickness: 12  // adjust bar width here
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          display: false
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: 'Хэрэглээ (Kв.цаг)'  
          }
        },
        x: {
          title: {
            display: true,
            text: 'Сүүлын 24 цаг' 
          }
        }
      }
    }
  });
  
  
$(document).ready(function () {
    $('#parentNodeDropdown').jstree({
        core: {
            data: {
                url: '/line-tree-data',
                dataType: 'json'
            },
            themes: {
                stripes: true
            }
        },
        plugins: ["search"] // enable search
    })
    .on("select_node.jstree", function (e, data) {
        // Store node text
        $('#parent_node_input').val(data.node.text);
        $('#treeSearch').val(data.node.text); 

        $('#parentNodeDropdown').hide();
        const offsetMs = 8 * 60 * 60 * 1000; // UTC+8
         
        

    // tsag gargah
    const endTime = new Date(Date.now() + offsetMs);  
    console.log(endTime)   
    const startTime = new Date(endTime.getTime() - 6 * 60 * 60 * 1000); // minus 6 hours 
    const isoEnd = endTime.toISOString().split('.')[0];
    const isoStart = startTime.toISOString().split('.')[0]; 


    // active power graph ogogdol avah 
    $.getJSON(`/active-power-last6h`, {
      line: data.node.text,
      start: isoStart,
      end: isoEnd
    }, function(response) {
      console.log(response)   
      if (response && Array.isArray(response)) { 
        const labels = response.map(item => item.timestamp);
        const values = response.map(item => item.value); 
        consumptionLineChart.data.labels = labels;  
        consumptionLineChart.data.datasets[0].data = values; 
        consumptionLineChart.update(); 
        console.log("updated values")
      } else {
        consumptionLineChart.data.labels = [];  
        consumptionLineChart.data.datasets[0].data = [];
        consumptionLineChart.update();
        alert('No data found for selected line and time range.');
      }
    }).fail(function() {
      alert('Failed to fetch data from server.');
    });

    // 24 tsagin total consumption ogogdol avah 
    const startTime_1 = new Date(endTime.getTime() - 24 * 60 * 60 * 1000); // minus 24 hours 
    const isoEnd_1 = endTime.toISOString().split('.')[0];
    const isoStart_1 = startTime_1.toISOString().split('.')[0]; 

    $.getJSON(`/hourly-consumption-last24h`, {
      line: data.node.text,
      start: isoStart_1,
      end: isoEnd_1
    }, function(response) {
      console.log(response)   
      if (response && Array.isArray(response)) { 
        const labels = response.map(item => item.timestamp);
        const values = response.map(item => item.value); 
        consumptionBarChart24hour.data.labels = labels;  
        consumptionBarChart24hour.data.datasets[0].data = values; 
        consumptionBarChart24hour.update(); 
        console.log("updated values")
      } else {
        consumptionBarChart24hour.data.labels = [];  
        consumptionBarChart24hour.data.datasets[0].data = [];
        consumptionBarChart24hour.update();
        alert('No data found for selected line and time range.');
      }
    }).fail(function() {
      alert('Failed to fetch data from server.');
    }); 

    // 30 odriin total consumption ogogdol avah 
    const startTime_2 = new Date(endTime.getTime() - 30 *24 * 60 * 60 * 1000); // minus 30 day  
    const isoEnd_2 = endTime.toISOString().split('.')[0];
    const isoStart_2 = startTime_2.toISOString().split('.')[0];  
    
    $.getJSON(`/daily-consumption-last30d`, { 
      line: data.node.text,
      start: isoStart_2,
      end: isoEnd_2
    }, function(response) {
      console.log(response)   
      if (response && Array.isArray(response)) { 
        const labels = response.map(item => item.timestamp);
        const values = response.map(item => item.value); 
        consumptionBarChart30day.data.labels = labels;  
        consumptionBarChart30day.data.datasets[0].data = values; 
        consumptionBarChart30day.update(); 
        console.log("updated values")
      } else {
        consumptionBarChart30day.data.labels = [];  
        consumptionBarChart30day.data.datasets[0].data = [];
        consumptionBarChart30day.update(); 
        alert('No data found for selected line and time range.');
      }
    }).fail(function() {
      alert('Failed to fetch data from server.');
    }); 

    });

    // Simple toggle click to open/close tree dropdown
    $('#parentNodeDropdown').css({
    position: 'absolute',
    zIndex: 99999,   // super high so it’s always on top
    background: '#fff', // optional, so it doesn't inherit transparency
    border: '1px solid #ccc' // optional for visual clarity
}).hide();
    $('<input type="text" id="treeSearch" class="form-control" placeholder="Шугам сонгох..." style="height: 33px; border-radius: 2px !important; padding-right: 30px;" >')
        .insertBefore('#parentNodeDropdown')
        .on('focus', function () {
            $('#parentNodeDropdown').show();
        })
        .on('keyup', function () {
            $('#parentNodeDropdown').jstree(true).search($(this).val());
        });

    // Hide dropdown when clicking outside
    $(document).click(function(e) {
        if (!$(e.target).closest('#parentNodeDropdown, #treeSearch').length) {
            $('#parentNodeDropdown').hide();
        }
    });
}); 
   
</script>
{% endblock %}
