const centerTextPlugin = {
    id: 'centerText',
    beforeDraw(chart) {
        const { ctx, width, height } = chart;

        ctx.font = fontSize + "px sans-serif";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        const text = "{{ total_installations }}"; // Replace with your dynamic value if needed
        const textX = Math.round((width - ctx.measureText(text).width) / 2);
        const textY = height / 2;
        ctx.fillText(text, textX, textY);
        ctx.restore();
    }
};

let currentDataType = 'Original';

$(document).ready(function () {
    $('#parentNodeDropdown').jstree({
        core: {
            data: {
                url: '/line-tree-data',
                dataType: 'json'
            },
            themes: {
                stripes: true
            }
        },
        plugins: ["search"], // enable search
        icons: false // disable default icons
    })
    .on("ready.jstree", function (e, data) {
        // Automatically select the first line when tree is loaded
        const tree = data.instance;
        
        // Get all nodes in flat format
        const allNodes = tree.get_json('#', { flat: true });
        
        // Find the first leaf node (actual line, not a parent)
        let firstLeafNode = null;
        for (let i = 0; i < allNodes.length; i++) {
            const node = allNodes[i];
            // Check if it's a leaf node (has no children or children array is empty)
            if (!node.children || node.children.length === 0) {
                firstLeafNode = node;
                break;
            }
        }
        
        // If no leaf node found, try to get the first node anyway
        if (!firstLeafNode && allNodes.length > 0) {
            firstLeafNode = allNodes[0];
        }
        
        // Select the first node programmatically
        if (firstLeafNode) {
            tree.select_node(firstLeafNode.id);
        }
    })
    .on("select_node.jstree", function (e, data) {
        // Store node text
        $('#parent_node_input').val(data.node.text);
        $('#treeSearch').val(data.node.text); 

        $('#parentNodeDropdown').removeClass('open').hide();
        const offsetMs = 8 * 60 * 60 * 1000; // UTC+8

    const startTime = new Date(endTime.getTime() - 6 * 60 * 60 * 1000); // minus 6 hours 
    const isoEnd = endTime.toISOString().split('.')[0];
    const isoStart = startTime.toISOString().split('.')[0]; 


    // active power graph ogogdol avah 
    $.getJSON(`/active-power-last6h`, {
      line: data.node.text,
      start: isoStart,
      end: isoEnd
    }, function(response) {
      console.log(response)   
      if (response && Array.isArray(response)) { 
        const labels = response.map(item => item.timestamp);
        const values = response.map(item => item.value); 
        consumptionLineChart.data.labels = labels;  
        consumptionLineChart.data.datasets[0].data = values; 
        consumptionLineChart.update(); 
        console.log("updated values")
      } else {
        consumptionLineChart.data.labels = [];  
        consumptionLineChart.data.datasets[0].data = [];
        consumptionLineChart.update();
        alert('No data found for selected line and time range.');
      }
    }).fail(function() {
      alert('Failed to fetch data from server.');
    });

    // 24 tsagin total consumption ogogdol avah 
    const startTime_1 = new Date(endTime.getTime() - 24 * 60 * 60 * 1000); // minus 24 hours 
    const isoEnd_1 = endTime.toISOString().split('.')[0];
    const isoStart_1 = startTime_1.toISOString().split('.')[0]; 

    $.getJSON(`/hourly-consumption-last24h`, {
      line: data.node.text,
      start: isoStart_1,
      end: isoEnd_1,
      type: currentDataType
    }, function(response) {
      console.log(response)   
      if (response && Array.isArray(response)) { 
        const labels = response.map(item => item.timestamp);
        const values = response.map(item => item.value); 
        consumptionBarChart24hour.data.labels = labels;  
        consumptionBarChart24hour.data.datasets[0].data = values; 
        consumptionBarChart24hour.update(); 
        console.log("updated values")
      } else {
        consumptionBarChart24hour.data.labels = [];  
        consumptionBarChart24hour.data.datasets[0].data = [];
        consumptionBarChart24hour.update();
        alert('No data found for selected line and time range.');
      }
    }).fail(function() {
      alert('Failed to fetch data from server.');
    }); 

    // 30 odriin total consumption ogogdol avah 
    const startTime_2 = new Date(endTime.getTime() - 30 *24 * 60 * 60 * 1000); // minus 30 day  
    const isoEnd_2 = endTime.toISOString().split('.')[0];
    const isoStart_2 = startTime_2.toISOString().split('.')[0];  
    
    $.getJSON(`/daily-consumption-last30d`, { 
      line: data.node.text,
      start: isoStart_2,
      end: isoEnd_2,
      type: currentDataType
    }, function(response) {
      console.log(response)   
      if (response && Array.isArray(response)) {

        const values = response.map(item => item.value); 
        consumptionBarChart30day.data.labels = labels;  
        consumptionBarChart30day.data.datasets[0].data = values; 
        consumptionBarChart30day.update(); 
        console.log("updated values")
      } else {

        consumptionBarChart30day.data.datasets[0].data = [];
        consumptionBarChart30day.update(); 
        alert('No data found for selected line and time range.');
      }
    }).fail(function() {
      alert('Failed to fetch data from server.');
    }); 

    });

// Function to refresh all charts based on current switch state
function refreshAllCharts() {
  const line = $('#treeSearch').val();
  if (!line) {
    return; // No line selected, can't refresh
  }

  const offsetMs = 8 * 60 * 60 * 1000; // UTC+8
  const endTime = new Date(Date.now() + offsetMs);
  
  // Active power (last 6 hours) - uses regular_task_readings (no calculated version)
  const startTime = new Date(endTime.getTime() - 6 * 60 * 60 * 1000);
  const isoEnd = endTime.toISOString().split('.')[0];
  const isoStart = startTime.toISOString().split('.')[0];

  $.getJSON(`/active-power-last6h`, {
    line: line,
    start: isoStart,
    end: isoEnd
  }, function(response) {
    if (response && Array.isArray(response)) {
      const labels = response.map(item => item.timestamp);
      const values = response.map(item => item.value);
      consumptionLineChart.data.labels = labels;
      consumptionLineChart.data.datasets[0].data = values;
      consumptionLineChart.update();
    }
  });

  // Hourly consumption (last 24 hours)
  const startTime_1 = new Date(endTime.getTime() - 24 * 60 * 60 * 1000);
  const isoEnd_1 = endTime.toISOString().split('.')[0];
  const isoStart_1 = startTime_1.toISOString().split('.')[0];

  $.getJSON(`/hourly-consumption-last24h`, {
    line: line,
    start: isoStart_1,
    end: isoEnd_1,
    type: currentDataType
  }, function(response) {
    if (response && Array.isArray(response)) {
      const labels = response.map(item => item.timestamp);
      const values = response.map(item => item.value);
      consumptionBarChart24hour.data.labels = labels;
      consumptionBarChart24hour.data.datasets[0].data = values;
      consumptionBarChart24hour.update();
    }
  });

  // Daily consumption (last 30 days)
  const startTime_2 = new Date(endTime.getTime() - 30 * 24 * 60 * 60 * 1000);
  const isoEnd_2 = endTime.toISOString().split('.')[0];
  const isoStart_2 = startTime_2.toISOString().split('.')[0];

  $.getJSON(`/daily-consumption-last30d`, {
    line: line,
    start: isoStart_2,
    end: isoEnd_2,
    type: currentDataType
  }, function(response) {
    if (response && Array.isArray(response)) {
      const labels = response.map(item => item.timestamp);
      const values = response.map(item => item.value);
      consumptionBarChart30day.data.labels = labels;
      consumptionBarChart30day.data.datasets[0].data = values;
      consumptionBarChart30day.update();
    }
  });
}

// Switch button functionality
$(document).ready(function() {
  $('#dashboardSwitch').on('change', function() {
    const isChecked = $(this).is(':checked');
    const label = $('#switchLabel');
    
    if (isChecked) {
      label.text('Calculated');
      currentDataType = 'Calculated';
      console.log('Switch is ON - Calculated mode enabled');
    } else {
      label.text('Original');
      currentDataType = 'Original';
      console.log('Switch is OFF - Original mode enabled');
    }
    
    // Refresh all charts with new data type
    refreshAllCharts();
  });
  
  // Initialize switch state
  const switchInput = $('#dashboardSwitch');
  if (switchInput.length) {
    switchInput.prop('checked', false);
    $('#switchLabel').text('Original');
  }

  // Add transition effects to date input (similar to daterangepicker)
  const dateInput = document.getElementById('selected_date');
  let datePickerTimeout;
  
  if (dateInput) {
    // Enhanced visual feedback when date picker is being used
    dateInput.addEventListener('focus', function() {
      clearTimeout(datePickerTimeout);
      this.classList.add('date-picker-open');
      
      // Add enhanced state after a brief delay (simulating calendar opening)
      setTimeout(() => {
        this.classList.add('date-picker-active');
      }, 150);
    });
    
    // Handle click for immediate feedback
    dateInput.addEventListener('click', function() {
      clearTimeout(datePickerTimeout);
      this.classList.add('date-picker-open');
      
      setTimeout(() => {
        this.classList.add('date-picker-active');
      }, 100);
    });
    
    dateInput.addEventListener('mousedown', function() {
      clearTimeout(datePickerTimeout);
      this.classList.add('date-picker-open');
    });
    
    // Remove classes when calendar closes
    dateInput.addEventListener('blur', function() {
      const self = this;
      clearTimeout(datePickerTimeout);
      
      // Delay removal to allow any animations to complete
      datePickerTimeout = setTimeout(() => {
        self.classList.remove('date-picker-open', 'date-picker-active');
      }, 400);
    });
    
    // Also handle when a date is selected
    dateInput.addEventListener('change', function() {
      const self = this;
      clearTimeout(datePickerTimeout);
      
      // Keep the active state briefly after selection, then remove
      datePickerTimeout = setTimeout(() => {
        self.classList.remove('date-picker-open', 'date-picker-active');
      }, 300);
    });
  }
});

function exportTableToExcel() {
  const selectedDate = document.getElementById('selected_date').value;
  if (!selectedDate) {
    alert('Please select a date first!');
    return;
  }

  const url = `/export-Excel-24H-consumpsion?selected_date=${encodeURIComponent(selectedDate)}`;

  fetch(url, {
    method: 'GET'
  })
    .then(response => {
      if (!response.ok) throw new Error('Failed to download file');
      return response.blob();
    })
    .then(blob => {
      const downloadUrl = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = `export_24H_${selectedDate}.xlsx`; 
      document.body.appendChild(a);
      a.click();
      a.remove();
    })
    .catch(err => console.error(err));
}
